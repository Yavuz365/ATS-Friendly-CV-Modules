# ATS-CV-Modules — Kullanıcı Profili Konfigürasyonu
# Kaynak: Viktor Hybrid Revizyon v2.0, Desen 8 (Ads Toolkit Config Layer)
# Bu dosya, motorun kullanıcı-spesifik davranışını yapılandırır.
# P1 aşamasında motor tarafından okunacak.
#
# ⚠️ GİZLİLİK NOTU (2026-08-05 düzeltmesi):
# Bu dosya PUBLIC bir repoda tutulduğu için gerçek kişisel bilgiler
# (ad-soyad, hedef roller, dil seviyeleri, sektör hedefleri) buraya
# YAZILMAMALIDIR. Aşağıdaki değerler placeholder'dır. Kendi gerçek
# değerlerinizi, git tarafından TAKİP EDİLMEYEN bir kopyada tutun,
# örn. `config/user_profile.local.yaml` (bkz. .gitignore) ve motoru
# o dosyayı okuyacak şekilde yapılandırın.
#
# NOT: Bu dosyanın önceki commit geçmişinde gerçek kişisel veriler
# yer alıyordu. Bu commit yalnızca HEAD'i temizler; geçmiş commitlerden
# tam kaldırma (history rewrite) ayrı, geri döndürülemez bir işlemdir ve
# repo sahibinin ayrı onayını gerektirir.

user:
  name: "PLACEHOLDER_NAME"
  languages:
    native: "xx"
    proficient: []          # C1+
    intermediate: []         # B2
    basic: []                # A2
  target_roles:
    - "PLACEHOLDER_ROLE_1"
    - "PLACEHOLDER_ROLE_2"
  experience_years: 0
  sectors:
    - "PLACEHOLDER_SECTOR"

diagnostics:
  # Kaynak, sürüm ve tarih bağlı bir evaluation profile olmadan evrensel threshold yoktur.
  threshold_profile: null
  commercial_comparators: []

cv_preferences:
  format: "docx"                # Çıktı formatı
  layout: "single_column"       # Tek sütun
  word_budget: [600, 1000]      # Kelime bütçesi
  bullet_per_role: [3, 6]       # Her rol için bullet sayısı
  quantification_target: null   # Role/market profile ile açıkça sürümlenmelidir
  cliche_max_ratio: null        # Evrensel kalite kapısı değildir

naming_conventions:
  cv_file: "{role}_{company}_{date}.docx"
  jd_file: "{role}_{company}.pdf"
  analysis_file: "{role}_{company}_analysis.md"

domain_packs:
  primary: "foreign-trade-logistics"
  secondary: []                 # Gelecekte: finance, it, healthcare

approval:
  mode: "approval-first"        # Tüm çıktılar onay gerektirir
  channels: []                  # Entegrasyonlar uygulanmadı

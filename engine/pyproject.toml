[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-engine"
version = "1.0.0"
description = "ATS-Friendly-CV-Modules — sentez+analiz tabanlı, audit-düzeltmeli ATS CV motoru"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ats-engine = "ats_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ats_engine*"]

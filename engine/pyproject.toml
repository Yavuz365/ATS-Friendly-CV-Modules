[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-engine"
version = "1.5.1"
description = "ATS-Friendly-CV-Modules — sentez+analiz tabanlı, audit-düzeltmeli ATS CV motoru"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0"]
# A10 fix: ruff + mypy zaten [tool.ruff]/[tool.mypy] altında yapılandırılmıştı
# ama hiçbir yerde (ne yerel dev kurulumunda ne CI'da) çalıştırılmıyorlardı —
# yapılandırma "ölü" idi. Artık dev extra'sının bir parçası ve CI'da çalışıyorlar.
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ats-engine = "ats_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ats_engine*"]

# P0-5 fix: ATSE-4'ün "*.json/*.txt her yerde dahil et" kuralı sdist için
# çalışıyordu ama data/ ve domain-packs/ paket ağacının (ats_engine/) DIŞINDA
# olduğu için wheel'e hiç girmiyordu (clean-room kurulumda FileNotFoundError
# ile doğrulandı). Veriler artık ats_engine/data/ ve
# ats_engine/domain_pack_data/ altında — paketin kendi içinde — bu yüzden
# glob'u paket-göreli ve recursive olarak açıkça tanımlıyoruz.
[tool.setuptools.package-data]
ats_engine = ["data/*.json", "data/*.txt", "domain_pack_data/**/*.json"]

[tool.setuptools]
include-package-data = true

# ── ATSE-13: Kod kalite altyapısı ────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["ats_engine"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long — ruff formatter handles this
    "B008",   # do not perform function calls in argument defaults
    "RUF001", # string contains ambiguous unicode — TR chars
    "RUF002", # docstring contains ambiguous unicode — TR chars
    "RUF003", # comment contains ambiguous unicode — TR chars
]

[tool.ruff.lint.isort]
known-first-party = ["ats_engine"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

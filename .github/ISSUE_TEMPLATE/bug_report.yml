name: Bug report
description: Reproducible engine, contract, ingestion or documentation defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact status/error code and redacted input shape.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and personal CV/JD data.
          required: true

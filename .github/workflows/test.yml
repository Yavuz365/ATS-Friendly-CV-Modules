name: Engine CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine + dev deps
        run: pip install -e "engine/[dev]"

      - name: Run tests
        run: pytest engine/tests/ -v --tb=short

      - name: CLI smoke test
        run: |
          python -m ats_engine.cli score \
            --jd engine/examples/sample_jd_foreign_trade.txt \
            --cv engine/examples/sample_cv.txt \
            --no-sbert

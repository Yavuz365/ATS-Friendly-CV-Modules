name: Engine CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine and development gates
        run: python -m pip install -e "engine[dev]"
      - name: Ruff lint
        run: ruff check engine/ats_engine engine/tests
      - name: Ruff format contract
        run: ruff format --check engine/ats_engine engine/tests
      - name: Mypy
        run: mypy --cache-dir=.mypy_cache_v2 engine/ats_engine
      - name: Schema and golden contract tests
        run: pytest -q engine/tests/test_contracts_ingestion.py engine/tests/test_legacy_contract.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e "engine[dev]"
      - name: Unit, regression and contract tests
        run: pytest -q engine/tests
      - name: CLI success smoke
        run: >-
          ats-engine score
          --jd engine/examples/sample_jd_foreign_trade.txt
          --cv engine/examples/sample_cv.txt
          --must "incoterms,customs clearance"
          --no-sbert

  package:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build engine --sdist --wheel --outdir dist/2.0.0a2
      - name: Verify wheel manifest snapshot
        run: python scripts/verify_wheel.py dist/2.0.0a2/*.whl
      - name: Clean-wheel install and runtime smoke
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/2.0.0a2/*.whl
          mkdir .ci-smoke
          cd .ci-smoke
          ../.ci-venv/bin/python -c "import ats_engine; assert ats_engine.__version__ == '2.0.0a2'; assert 'foreign-trade-logistics' in ats_engine.list_packs()"
          ../.ci-venv/bin/ats-engine ingest --document ../engine/examples/sample_cv.txt

  historical-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate immutable legacy baseline evidence
        run: |
          python -m pip install build
          set +e
          python scripts/freeze_legacy_baseline.py \
            --commit 3b6cce1e4c2919146752590f7bece4ae2812a8f5 \
            --output dist/baseline/legacy-3b6cce1
          code=$?
          set -e
          test "$code" = 0 -o "$code" = 2
          test -s dist/baseline/legacy-3b6cce1/SOURCE_COMMIT.txt
          test -s dist/baseline/legacy-3b6cce1/reproduction-report.json
          test -s dist/baseline/legacy-3b6cce1/SHA256SUMS.txt
          test -s dist/baseline/legacy-3b6cce1/source-3b6cce1e4c2919146752590f7bece4ae2812a8f5.tar.gz
      - name: Upload historical baseline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-baseline-3b6cce1
          path: dist/baseline/legacy-3b6cce1
          if-no-files-found: error
          retention-days: 90

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit declared dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --strict --requirement engine/requirements.txt
